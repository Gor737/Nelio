name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: nelio
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: nelio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nelio -d nelio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://nelio:ci_password@localhost:5432/nelio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/backend/package-lock.json
      - run: npm ci
      - run: npm run prisma:validate
      - run: npm run prisma:generate
      - run: npm run lint
      - run: npx tsc --noEmit -p tsconfig.build.json
      - run: npm run check:architecture
      - run: npm test
      - run: npm run test:e2e
      - run: npm run test:integration
      - run: npm run openapi:export
      - run: git diff --exit-code -- openapi.json
